<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="container">
        <h1>Calculadora</h1>
        <input type="number" name="" id="num1" placeholder="Digite o primeiro número:">
        <input type="number" name="" id="num2" placeholder="Digite o segundo número:">
    

    <div class="botoes">
        <button onclick="somar()">+</button>
        <button onclick="subtrair()">-</button>
        <button onclick="multiplicacao()">*</button>
        <button onclick="divisao()">/</button>
    </div>

    <div id="resultado">
        Resultado: <span>0</span>
    </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
