<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stringfy</title>
</head>
<body>
    

    <script>
        let pessoa = {
            nome: "Diego",
            idade: 34,
        };

        console.log(pessoa);
        console.log(typeof pessoa);

        let json = JSON.stringify(pessoa);

        console.log(json);
        console.log(typeof json);
        
    </script>
</body>
</html>
