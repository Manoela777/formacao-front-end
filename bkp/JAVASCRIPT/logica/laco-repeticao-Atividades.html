<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laços de Repetição - Atividades</title>
</head>
<body>
    <script>
        //exiba os números de 1 a 20
        for (let i = 1;i <=20; i++){
            console.log(i);
        }console.log("------------------");

        //exiba os números de 20 a 1
        for (let i = 20; i >=1; i--){
            console.log(i);
        }console.log("------------------");

        //exiba apenas os números pares de 0 a 50
        for (let i =0; i<=50; i++){
            if(i % 2 === 0){
                console.log(i);
            }
        }
        /*for (let i =0; i<=50; i = i + 2){
                console.log(i);
        }*/
        console.log("------------------");

        //entrada de dados pelo usuário. 
        // Peça ao usuário um número e mostre a tabuada desse número
        let numero = parseInt(prompt("Digite um número para aparecer a sua tabuada:"))
        for (let i=0; i<=10;i++){
             console.log(numero + "x" + i + "=" + (numero*i));
        }console.log("------------------");
        //crie um programa que exiba a seguinte saída
        //*
        //**
        //***
        //****
        //*****
        let asterisco = ""; 
        for (let i = 1; i <=5; i++){ 
            asterisco += "*"; 
            console.log(asterisco);
        }console.log("------------------");
    </script>
</body>
</html>
