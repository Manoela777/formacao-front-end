<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores Lógicos</title>
</head>
<body>
    <script>
        //Operadores Lógicos
        //Esses operadores são usados para combinar expressões lógicas

        // operador lógico E (&&): retorna verdadeiro se ambas as expressões forem verdadeiras
        console.log("---------------&&--------------");
        let nome = 'Maria';
        let senha = 1234;
        let resultado = nome == 'Maria' && senha == '1234';
        console.log(resultado);

        //operador lógico OU (||): retorna verdadeiro se pelo menos uma expressão for verdadeira
        console.log("---------------||--------------");
        resultado = nome == 'diego' || senha == 1234;
        console.log(resultado);
    </script>
</body>
</html>
